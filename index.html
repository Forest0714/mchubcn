<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="canonical" href="https://crmo.cn/">
<link rel="dns-prefetch" href="//crmo.cn">
<link rel="preconnect" href="https://crmo.cn" crossorigin>
<title>正在跳转…</title>

<!-- ★ 跳转脚本：必须放在所有内容最前面，浏览器一解析到就跳 -->
<script>
(function () {
  var target = "https://crmo.cn/";
  try {
    // 用 top 防止页面被别人用 iframe 嵌套后只跳内层
    (window.top || window).location.replace(target);
  } catch (e) {
    // 跨域被拒绝时，退回到跳自己
    window.location.replace(target);
  }
  // 极端兜底：300ms 后若还没走，强制再跳一次
  setTimeout(function () {
    if (location.href.indexOf("crmo.cn") === -1) {
      location.href = target;
    }
  }, 300);
})();
</script>

<!-- ★ 无 JS 环境兜底（0 秒刷新） -->
<meta http-equiv="refresh" content="0;url=https://crmo.cn/">

<style>
  body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
       font:14px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#666}
  a{color:#1a73e8}
</style>
</head>
<body>
  <p>正在跳转，请稍候… 如果没有自动跳转，请 <a href="https://crmo.cn/">点击这里</a></p>
</body>
</html>
