<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全新方块工坊</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            padding: 30px;
        }

        .container {
            text-align: center;
        }

        .title {
            font-size: clamp(24px, 5vw, 52px);
            font-weight: 500;
            color: #121212;
            letter-spacing: 0.14em;
            margin-bottom: clamp(16px, 3vw, 32px);
        }

        .subtitle {
            font-size: clamp(17px, 2.8vw, 30px);
            font-weight: 300;
            color: #444444;
            letter-spacing: 0.22em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">全新方块工坊即将呈现</div>
        <div class="subtitle">美好的事情即将发生</div>
    </div>
</body>
</html>
